<form id="contact-form" action="https://api.web3forms.com/submit" method="post">
	<input type="hidden" name="access_key" value="69bcc78f-1fdc-43c8-8aaa-b4424deb3c53">
	<input type="hidden" name="subject" value="Neue Nachricht über die Portfolio-Seite">
	<input type="checkbox" name="botcheck" class="visually-hidden" tabindex="-1" style="display:none">
	<input type="text" name="website" class="visually-hidden" tabindex="-1" autocomplete="off">
	<input class="form-field" type="text" name="name" placeholder="Ihr Name" required>
	<input class="form-field" type="email" name="email" placeholder="Ihre E-Mailadresse" required>
	<textarea class="form-field" name="message" rows="5" placeholder="Ihre Nachricht an mich" required></textarea>
	<button type="submit" class="button">Nachricht senden</button>
	<p id="form-status" class="form-status" hidden></p>
</form>
